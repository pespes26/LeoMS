<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — LeoMS</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><header><a class="brand" th:href="@{/}">LeoMS admin</a><nav><a th:href="@{/accounts}">Accounts</a></nav></header><main>
<p class="alert" th:if="${message}" th:text="${message}"></p><p class="alert error" th:if="${error}" th:text="${error}"></p>
<h1 th:text="${account.name}"></h1><p><span class="badge" th:text="${account.banned ? 'Banned' : 'Active'}"></span> <span th:if="${account.banReason}" th:text="${account.banReason}"></span></p>
<section><h2>Characters</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Level</th><th>Job</th><th>World</th><th>GM</th></tr></thead><tbody><tr th:each="character : ${characters}"><td th:text="${character.name}"></td><td th:text="${character.level}"></td><td th:text="${character.job}"></td><td th:text="${character.world}"></td><td th:text="${character.gm}"></td></tr><tr th:if="${#lists.isEmpty(characters)}"><td colspan="5">No characters.</td></tr></tbody></table></div></section>
<section><h2>Reset credentials</h2><form class="grid-form" th:action="@{/accounts/{id}/credentials(id=${account.id})}" th:object="${resetForm}" method="post"><label>New password (leave blank to keep)<input type="password" th:field="*{password}" autocomplete="new-password"><small th:errors="*{password}"></small></label><label>New PIN<input type="password" inputmode="numeric" th:field="*{pin}"><small th:errors="*{pin}"></small></label><label>New PIC<input type="password" inputmode="numeric" th:field="*{pic}"><small th:errors="*{pic}"></small></label><button type="submit">Reset selected credentials</button></form></section>
<section><h2>Ban controls</h2><form th:if="${!account.banned}" th:action="@{/accounts/{id}/ban(id=${account.id})}" th:object="${banForm}" method="post"><label>Recorded reason<input th:field="*{reason}" maxlength="255" required></label><button class="danger" type="submit">Ban account</button></form><form th:if="${account.banned}" th:action="@{/accounts/{id}/unban(id=${account.id})}" method="post"><button type="submit">Unban account</button></form></section>
</main></body></html>
